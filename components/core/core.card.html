<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, Badge, Chip, Input, ProgressBar, QtyStepper, Skeleton, Icon } = window.PadelMNiaDesignSystem_b97c58;
function Card(){
  const [sort,setSort]=React.useState('Ajánlott');
  const [qty,setQty]=React.useState(2);
  return (<div>
    <div className="cap">Button</div>
    <div className="row">
      <Button variant="primary" iconRight={<Icon name="arrow-right" size={16} weight="bold"/>}>Indítsd el</Button>
      <Button variant="secondary">Vásárlás</Button>
      <Button variant="outline">Regisztráció</Button>
      <Button variant="ghost">Részletek</Button>
      <Button variant="primary" size="sm" pill>Csatlakozz</Button>
      <Button variant="primary" size="sm" disabled>Elfogyott</Button>
      <Button variant="danger" size="sm" iconLeft={<Icon name="sign-out" size={14} weight="bold"/>}>Kijelentkezés</Button>
    </div>
    <div className="cap">Badge</div>
    <div className="row">
      <Badge tone="brand" caps>Akció</Badge>
      <Badge tone="success">Kipróbálható</Badge>
      <Badge tone="accent">1.0-2.0</Badge>
      <Badge tone="outline">Készleten</Badge>
      <Badge tone="open">Nyitva</Badge>
      <Badge tone="closed">Zárva</Badge>
      <Badge tone="action" caps size="sm">App</Badge>
    </div>
    <div className="cap">Chip</div>
    <div className="row">
      {['Ajánlott','Távolság','Értékelés','Vélemények'].map(l=>(
        <Chip key={l} selected={sort===l} onClick={()=>setSort(l)} iconLeft={<Icon name={l==='Távolság'?'map-trifold':l==='Vélemények'?'chat-dots':'star'} size={13} weight="bold"/>}>{l}</Chip>

      <Chip kind="chip">Puha mag</Chip>
    </div>
    <div className="row" style={{alignItems:'flex-end',gap:16}}>
      <div style={{flex:'1 1 200px'}}><div className="cap">Input</div><Input label="E-mail" placeholder="nev@pelda.hu"/></div>
      <div style={{flex:'1 1 180px'}}><div className="cap">Input · error</div><Input label="Jelszó" type="password" error="Hibás jelszó" iconRight={<Icon name="eye" size={18} color="var(--text-muted)"/>}/></div>
      <div><div className="cap">QtyStepper</div><QtyStepper value={qty} onChange={setQty}/></div>
    </div>
    <div className="cap">ProgressBar · 3 / 5</div>
