<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);padding:14px}a{color:var(--text-action)}a:hover{color:var(--pm-coral-deep)}.tok{font:var(--fw-medium) 9px/1.3 var(--font-mono);color:var(--text-muted)}.lbl{font:var(--fw-semibold) 9px/1 var(--font-sans);letter-spacing:var(--tracking-caps-wide);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}.r{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.sq{height:56px;background:var(--pm-sky-tint);border:1.5px solid var(--pm-sky)}</style></head><body><div class="r">
<div><div class="sq" style="border-radius:6px"></div><div class="tok" style="margin-top:5px">6 · sm</div><div class="tok" style="opacity:.6">badges</div></div>
<div><div class="sq" style="border-radius:10px"></div><div class="tok" style="margin-top:5px">10 · md</div><div class="tok" style="opacity:.6">inputs, buttons</div></div>
<div><div class="sq" style="border-radius:12px"></div><div class="tok" style="margin-top:5px">12 · card</div><div class="tok" style="opacity:.6">category tile</div></div>
<div><div class="sq" style="border-radius:14px"></div><div class="tok" style="margin-top:5px">14 · card-lg</div><div class="tok" style="opacity:.6">product, CTA</div></div>
<div><div class="sq" style="border-radius:16px"></div><div class="tok" style="margin-top:5px">16 · lg</div><div class="tok" style="opacity:.6">CTA, quiz card</div></div>
<div><div class="sq" style="border-radius:24px"></div><div class="tok" style="margin-top:5px">24 · xl</div><div class="tok" style="opacity:.6">menu, profile</div></div>
<div><div class="sq" style="border-radius:9999px"></div><div class="tok" style="margin-top:5px">full</div><div class="tok" style="opacity:.6">chips, tab pill</div></div>
</div></body></html>
