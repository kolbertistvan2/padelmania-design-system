<!-- @dsCard group="Spacing" viewport="700x170" name="Gutters in use" subtitle="16px screen gutter · 12px between cards · 10px inside a card" -->
<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);padding:14px}a{color:var(--text-action)}a:hover{color:var(--pm-coral-deep)}.tok{font:var(--fw-medium) 9px/1.3 var(--font-mono);color:var(--text-muted)}.lbl{font:var(--fw-semibold) 9px/1 var(--font-sans);letter-spacing:var(--tracking-caps-wide);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}.ph{width:300px;border:1px solid var(--border-subtle);border-radius:var(--radius-card-lg);overflow:hidden}.hd{background:var(--surface-brand);height:34px}.gt{outline:1px dashed var(--pm-coral);outline-offset:0}</style></head><body><div style="display:flex;gap:20px;align-items:flex-start">
<div class="ph"><div class="hd"></div>
  <div style="padding:16px;display:flex;flex-direction:column;gap:12px">
    <div class="gt" style="background:var(--surface-sunken);border-radius:var(--radius-card);height:44px"></div>
    <div class="gt" style="background:var(--surface-sunken);border-radius:var(--radius-card);height:44px"></div>
  </div>
</div>
<div style="display:flex;flex-direction:column;gap:7px;padding-top:8px">
<div class="tok">--gutter · 16px — every mobile screen edge</div>
<div class="tok">12px — between stacked cards in a list</div>
<div class="tok">10px — inside a product / category card</div>
<div class="tok">--gutter-wide · 20px — quiz, results, auth</div>
<div class="tok">--gutter-widest · 24px — intro screens, hero blocks</div>
<div class="tok">--content-max · 700px — list + profile clamp on tablet</div>
</div></div></body></html>
