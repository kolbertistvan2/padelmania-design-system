<!-- @dsCard group="Colors" viewport="700x130" name="Semantic pairs" subtitle="Each state ships a solid and a tint" -->
<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);padding:14px}a{color:var(--text-action)}a:hover{color:var(--pm-coral-deep)}.g{display:grid;gap:8px}.sw{border-radius:8px;height:64px;display:flex;align-items:flex-end;padding:7px;box-sizing:border-box}.n{font:var(--fw-semibold) 10px/1.3 var(--font-sans)}.h{font:var(--fw-medium) 9px/1.3 var(--font-sans);opacity:.75}.lbl{font:var(--fw-semibold) 9px/1 var(--font-sans);letter-spacing:var(--tracking-caps-wide);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}.g{grid-template-columns:repeat(4,1fr)}.sw{height:44px;align-items:center}.p{display:grid;gap:4px}</style></head><body><div class="g">
<div class="p"><div class="sw" style="background:#D32F2F;color:#fff"><div><div class="n">--pm-error</div><div class="h">#D32F2F</div></div></div><div class="sw" style="background:#FFEBEE;color:#D32F2F"><div><div class="n">--pm-error-tint</div><div class="h">#FFEBEE</div></div></div></div>
<div class="p"><div class="sw" style="background:#F57C00;color:#fff"><div><div class="n">--pm-warning</div><div class="h">#F57C00</div></div></div><div class="sw" style="background:#FFF3E0;color:#F57C00"><div><div class="n">--pm-warning-tint</div><div class="h">#FFF3E0</div></div></div></div>
<div class="p"><div class="sw" style="background:#388E3C;color:#fff"><div><div class="n">--pm-success</div><div class="h">#388E3C</div></div></div><div class="sw" style="background:#E8F5E9;color:#388E3C"><div><div class="n">--pm-success-tint</div><div class="h">#E8F5E9</div></div></div></div>
<div class="p"><div class="sw" style="background:#0288D1;color:#fff"><div><div class="n">--pm-info</div><div class="h">#0288D1</div></div></div><div class="sw" style="background:#E1F5FE;color:#0288D1"><div><div class="n">--pm-info-tint</div><div class="h">#E1F5FE</div></div></div></div>
</div></body></html>
