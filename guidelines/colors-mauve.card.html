<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);padding:14px}a{color:var(--text-action)}a:hover{color:var(--pm-coral-deep)}.g{display:grid;gap:8px}.sw{border-radius:8px;height:64px;display:flex;align-items:flex-end;padding:7px;box-sizing:border-box}.n{font:var(--fw-semibold) 10px/1.3 var(--font-sans)}.h{font:var(--fw-medium) 9px/1.3 var(--font-sans);opacity:.75}.lbl{font:var(--fw-semibold) 9px/1 var(--font-sans);letter-spacing:var(--tracking-caps-wide);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}.g{grid-template-columns:repeat(3,1fr)}.sw{height:78px}</style></head><body><div class="g"><div class="sw" style="background:#D8C2C9;color:#281A1E"><div><div class="n">--pm-mauve</div><div class="h">#D8C2C9</div><div class="h">dusty wash</div></div></div><div class="sw" style="background:#523D44;color:#fff"><div><div class="n">--pm-burgundy</div><div class="h">#523D44</div><div class="h">editorial ground</div></div></div><div class="sw" style="background:#281A1E;color:#D8C2C9"><div><div class="n">--pm-burgundy-deep</div><div class="h">#281A1E</div><div class="h">near-black warm</div></div></div></div></body></html>
