<!-- @dsCard group="Spacing" viewport="700x140" name="Elevation" subtitle="Neutral shadows for chrome, teal-tinted for content cards" -->
<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);padding:14px}a{color:var(--text-action)}a:hover{color:var(--pm-coral-deep)}.tok{font:var(--fw-medium) 9px/1.3 var(--font-mono);color:var(--text-muted)}.lbl{font:var(--fw-semibold) 9px/1 var(--font-sans);letter-spacing:var(--tracking-caps-wide);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}.r{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:6px 2px 14px}.bx{height:62px;background:#fff;border-radius:var(--radius-lg)}</style></head><body><div class="r">
<div><div class="bx" style="box-shadow:var(--shadow-sm)"></div><div class="tok" style="margin-top:6px">--shadow-sm</div><div class="tok" style="opacity:.6">menus, bars</div></div>
<div><div class="bx" style="box-shadow:var(--shadow-md)"></div><div class="tok" style="margin-top:6px">--shadow-md</div><div class="tok" style="opacity:.6">sheets, CTA</div></div>
<div><div class="bx" style="box-shadow:var(--shadow-lg)"></div><div class="tok" style="margin-top:6px">--shadow-lg</div><div class="tok" style="opacity:.6">checkout bar</div></div>
<div><div class="bx" style="box-shadow:var(--shadow-card)"></div><div class="tok" style="margin-top:6px">--shadow-card</div><div class="tok" style="opacity:.6">category tile</div></div>
<div><div class="bx" style="box-shadow:var(--shadow-card-raised)"></div><div class="tok" style="margin-top:6px">--shadow-card-raised</div><div class="tok" style="opacity:.6">product card</div></div>
</div></body></html>
