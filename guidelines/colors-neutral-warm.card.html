<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);padding:14px}a{color:var(--text-action)}a:hover{color:var(--pm-coral-deep)}.g{display:grid;gap:8px}.sw{border-radius:8px;height:64px;display:flex;align-items:flex-end;padding:7px;box-sizing:border-box}.n{font:var(--fw-semibold) 10px/1.3 var(--font-sans)}.h{font:var(--fw-medium) 9px/1.3 var(--font-sans);opacity:.75}.lbl{font:var(--fw-semibold) 9px/1 var(--font-sans);letter-spacing:var(--tracking-caps-wide);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}.g{grid-template-columns:repeat(3,1fr)}.sw{height:78px}</style></head><body><div class="g"><div class="sw" style="background:#F5F1E8;color:#221F1B"><div><div class="n">--pm-cream</div><div class="h">#F5F1E8</div><div class="h">sunken surface, icon discs</div></div></div><div class="sw" style="background:#E5DCC5;color:#221F1B"><div><div class="n">--pm-sand</div><div class="h">#E5DCC5</div><div class="h">warm fill</div></div></div><div class="sw" style="background:#736E63;color:#fff"><div><div class="n">--pm-warm-gray</div><div class="h">#736E63</div><div class="h">secondary copy</div></div></div></div></body></html>
