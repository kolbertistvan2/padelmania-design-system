<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);padding:14px}a{color:var(--text-action)}a:hover{color:var(--pm-coral-deep)}.row{display:flex;align-items:baseline;gap:14px;padding:4px 0}.tok{font:var(--fw-medium) 9px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;min-width:112px}.lbl{font:var(--fw-semibold) 9px/1 var(--font-sans);letter-spacing:var(--tracking-caps-wide);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}</style></head><body><div class="row"><span class="tok">--type-label · 13/500</span><span style="font:var(--type-label);color:var(--text-body)">Súlycsoport</span></div>
<div class="row"><span class="tok">--type-button · 15/600</span><span style="font:var(--type-button);color:var(--text-brand)">Kosárba</span></div>
<div class="row"><span class="tok">--type-screen-title · 17/600</span><span style="font:var(--type-screen-title);color:var(--text-primary)">Ütőválasztó</span></div>
<div class="row"><span class="tok">caps · 12/600 · 0.6px</span><span style="font:var(--fw-semibold) 12px/1.4 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-label)">Szolgáltatások</span></div>
<div class="row"><span class="tok">badge caps · 10/700</span><span style="font:var(--fw-bold) 10px/1.4 var(--font-sans);letter-spacing:var(--tracking-caps);color:var(--text-on-brand);background:var(--surface-brand);padding:3px 8px;border-radius:5px">AKCIÓ</span></div></body></html>
