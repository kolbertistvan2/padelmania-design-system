<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);padding:14px}a{color:var(--text-action)}a:hover{color:var(--pm-coral-deep)}.g{display:grid;gap:8px}.sw{border-radius:8px;height:64px;display:flex;align-items:flex-end;padding:7px;box-sizing:border-box}.n{font:var(--fw-semibold) 10px/1.3 var(--font-sans)}.h{font:var(--fw-medium) 9px/1.3 var(--font-sans);opacity:.75}.lbl{font:var(--fw-semibold) 9px/1 var(--font-sans);letter-spacing:var(--tracking-caps-wide);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}.g{grid-template-columns:repeat(6,1fr)}.sw{height:84px}</style></head><body><div class="g"><div class="sw" style="background:#FFFFFF;color:#221F1B"><div><div class="n">--surface-page</div><div class="h">#FFFFFF</div><div class="h">screens, cards</div></div></div><div class="sw" style="background:#F8F8F8;color:#221F1B"><div><div class="n">--surface-page-alt</div><div class="h">#F8F8F8</div><div class="h">cart, membership</div></div></div><div class="sw" style="background:#F5F1E8;color:#221F1B"><div><div class="n">--surface-sunken</div><div class="h">#F5F1E8</div><div class="h">stat tiles, discs</div></div></div><div class="sw" style="background:#E8F4F7;color:#0B3C49"><div><div class="n">--surface-accent</div><div class="h">#E8F4F7</div><div class="h">Mánia+ box, notices</div></div></div><div class="sw" style="background:#0B3C49;color:#fff"><div><div class="n">--surface-brand</div><div class="h">#0B3C49</div><div class="h">header, tab ground</div></div></div><div class="sw" style="background:#0A2F3A;color:#9CC9D5"><div><div class="n">--surface-brand-deep</div><div class="h">#0A2F3A</div><div class="h">inset promo panel</div></div></div></div></body></html>
