<!doctype html><html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);padding:14px}a{color:var(--text-action)}a:hover{color:var(--pm-coral-deep)}.g{display:grid;gap:8px}.sw{border-radius:8px;height:64px;display:flex;align-items:flex-end;padding:7px;box-sizing:border-box}.n{font:var(--fw-semibold) 10px/1.3 var(--font-sans)}.h{font:var(--fw-medium) 9px/1.3 var(--font-sans);opacity:.75}.lbl{font:var(--fw-semibold) 9px/1 var(--font-sans);letter-spacing:var(--tracking-caps-wide);text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}.g{grid-template-columns:repeat(3,1fr)}.sw{height:78px}</style></head><body><div class="g"><div class="sw" style="background:#FFC4B7;color:#591E11"><div><div class="n">--pm-blush</div><div class="h">#FFC4B7</div><div class="h">soft wash</div></div></div><div class="sw" style="background:#FF6B4A;color:#fff"><div><div class="n">--pm-coral</div><div class="h">#FF6B4A</div><div class="h">CTA, active tab, badges</div></div></div><div class="sw" style="background:#591E11;color:#FFC4B7"><div><div class="n">--pm-coral-deep</div><div class="h">#591E11</div><div class="h">print / deep accent</div></div></div></div></body></html>
